name: Build desktop packages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
      - name: Build Linux executable
        run: bash build_linux.sh
      - name: Package Linux artifact
        run: |
          cd dist
          zip -r lulu-linux.zip lulu*
      - uses: actions/upload-artifact@v4
        with:
          name: lulu-linux
          path: dist/lulu-linux.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build macOS app
        run: bash build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lulu-macos
          path: dist/lulu-macos.zip

  build-windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x86'
      - name: Install Python packages
        run: python -m pip install -r requirements-build.txt
      - name: Build Windows x86 executable
        run: python -m PyInstaller --clean --noconfirm LuluWindows32.spec
      - uses: actions/upload-artifact@v4
        with:
          name: lulu-windows-x86
          path: dist/lulu在摸鱼_x86.exe
